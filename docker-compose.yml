services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: safedaet_api
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8000}:${APP_PORT:-8000}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, urllib.request; urllib.request.urlopen(f'http://127.0.0.1:{os.environ.get(\\\"APP_PORT\\\", \\\"8000\\\")}/health', timeout=5)\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
